[project]
name = "csvit2-remake"
version = "0.1.0"
description = "Slimmed-down CS-ViT2 remake focused on patch_uv_rho_multibin"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.12.0",
  "einops==0.8.1",
  "h5py==3.15.1",
  "hydra-core==1.3.2",
  "kornia==0.8.2",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "opencv-python==4.12.0.88",
  "rich==14.2.0",
  "safetensors==0.7.0",
  "smplx==0.1.28",
  "swanlab",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==4.57.3",
  "webdataset==1.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
