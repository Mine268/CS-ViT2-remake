MODEL:
  img_size: 224
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
  stage: stage1
  stage1_weight: null
  num_frame: 1
  joint_type: "3"
  norm_by_hand: false
  backbone:
    backbone_str: model/facebook/dinov2-large
    infusion_layer: null
    drop_cls: false
    kwargs: {}
  handec:
    num_layer: 4
    num_head: 16
    dim_head: 64
    dim_mlp: 4096
    dropout: 0.1
    norm: layer
    context_dim: 1024
    skip_token_embed: false
    use_mean_init: false
    denorm_output: false
    cam_head_type: patch_uv_rho_multibin
    heatmap_resolution: [512, 512, 1024]
    root_z:
      num_bins: 8
      d_min: -0.71
      d_max: 0.75
      prior_k: 121.0
      geom_hidden_dim: 256
      dropout: 0.1
      use_data_source_embed: false
  persp_info_embed:
    type: ca
    num_sample: 8
    pie_fusion: all
  temporal_encoder:
    num_layer: 2
    num_head: 16
    trope_scalar: 20.0
    zero_linear: true
