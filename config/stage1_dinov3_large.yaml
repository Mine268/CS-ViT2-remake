defaults:
  - stage1
  - _self_

GENERAL:
  description: "stage1 dinov3-large no_norm patch_uv_rho_multibin"

MODEL:
  backbone:
    backbone_str: model/facebook/dinov3-vitl16-pretrain-lvd1689m
  handec:
    context_dim: 1024

TRAIN:
  # DINOv3-L/16 uses 1024-dim tokens and 14x14 patches at 224 input.
  # Keep full fine-tuning enabled unless overridden by the experiment command.
  # On 24GB RTX 3090, batch=8 passes a one-step smoke on an idle GPU; use 4 as
  # the safer default for multi-GPU training with validation and fragmentation.
  sample_per_device: 4
  backbone_lr: 1e-5
