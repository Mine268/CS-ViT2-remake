defaults:
  - stage1
  - _self_

GENERAL:
  description: "stage2 no_norm patch_uv_rho_multibin"
  total_step: 70000
  checkpoint_step: 3000

DATA:
  train:
    split: train_stage2
    groups:
      aux:
        _delete_: true
        weight: 0.80
        datasets:
          InterHand2.6M: 0.3636363636
          MTC: 0.2727272727
          DexYCB: 0.1818181818
          HO3D_v3: 0.1818181818
  val:
    batch_size: 6
    source: ${DATA.datasets.AssemblyHands.splits.val_stage2}

MODEL:
  stage: stage2
  num_frame: 7
  stage1_weight: null

TRAIN:
  sample_per_device: 6
  bbox_jitter:
    enabled: true
    prob: 0.7
    temporal_mode: clip
    center_shift: 0.10
    scale_range: [0.75, 1.35]
    aspect_ratio_range: [0.90, 1.10]
    frame_center_shift: 0.03
    frame_scale_range: [0.95, 1.05]
    min_edge_px: 8.0
